<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · CanteenGo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="center-page">
    <div class="glass-card" style="width:100%;max-width:420px">
      <div class="brand" style="margin-bottom:6px"><span class="brand-dot"></span> CanteenGo</div>
      <p class="muted" style="margin-bottom:18px">Skip the wait. Skip the line.</p>

      <div id="msg"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="loginId">School ID</label>
          <input id="loginId" name="login_id" placeholder="e.g. 04-23-0006" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPw">Password <small class="muted" style="font-weight:400">(or the temporary password from the cashier)</small></label>
          <input id="loginPw" name="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn block" type="submit">Log in</button>
      </form>

      <div class="alert info" style="margin-top:16px;font-size:0.88rem">
        <b>No account yet?</b> Go to the <b>school cashier</b> with your school ID card. The cashier creates your
        account and gives you a temporary password. New accounts start with <b>₱1,000.00</b>.
      </div>

    
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    const msg = $('#msg');
    // Already logged in? Go to home.
    api('/api/auth/me', { noRedirect: true })
      .then((me) => (location.href = me.must_change_password ? '/set-password.html' : '/'))
      .catch(() => {});

    $('#loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.submitter;
      withBusy(btn, async () => {
        try {
          const r = await api('/api/auth/login', { method: 'POST', body: { login_id: $('#loginId').value, password: $('#loginPw').value }, noRedirect: true });
          location.href = r.must_change_password ? '/set-password.html' : '/';
        } catch (err) { showError(msg, err.message); }
      });
    });

  </script>
</body>
</html>
