<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set your password · CanteenGo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="center-page">
    <div class="glass-card" style="width:100%;max-width:420px">
      <div class="brand" style="margin-bottom:6px"><span class="brand-dot"></span> CanteenGo</div>
      <h1 style="margin-top:10px">Set your own password</h1>
      <p class="muted" id="hello">You logged in with a temporary password from the school cashier. Choose your own password to continue.</p>

      <div id="msg"></div>

      <form id="pwForm" autocomplete="off">
        <div class="field">
          <label for="pw1">New password (min. 6 characters)</label>
          <input id="pw1" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="pw2">Confirm new password</label>
          <input id="pw2" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <button class="btn block" type="submit">Save password &amp; continue</button>
      </form>

      <div class="alert warn" style="margin-top:16px;font-size:0.85rem">
        Keep it private. You can change your password only <b>once every 7 days</b>.
        If you forget it, the school cashier can reset it.
      </div>
      <div class="divider"></div>
      <button class="btn ghost sm" onclick="logout()">Log out</button>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    const msg = $('#msg');
    api('/api/auth/me').then((me) => {
      if (!me.must_change_password) { location.href = '/'; return; }
      $('#hello').innerHTML = `Hi <b>${esc(me.full_name)}</b> (${esc(me.login_id)})! You logged in with a temporary password from the school cashier. Choose your own password to continue.`;
    }).catch(() => {});

    $('#pwForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if ($('#pw1').value !== $('#pw2').value) return showError(msg, 'Passwords do not match.');
      withBusy(e.submitter, async () => {
        try {
          await api('/api/auth/change-password', { method: 'POST', body: { new_password: $('#pw1').value } });
          location.href = '/';
        } catch (err) { showError(msg, err.message); }
      });
    });
  </script>
</body>
</html>
